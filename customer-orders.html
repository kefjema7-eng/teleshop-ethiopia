<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c16"><title>My Orders | TeleShop Ethiopia"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#071c16;--panel:#0c281f;--gold:#e2b956;--cream:#f2efe7;--muted:#9aa79f;--line:rgba(226,185,86,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#173b2b 0,transparent 34%),var(--bg);color:var(--cream);font-family:Manrope,Arial,sans-serif}.top{border-bottom:1px solid #ffffff12;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:800;color:var(--cream);text-decoration:none}.logo span{color:var(--gold)}.top a:last-child{font-size:12px;color:var(--gold);text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:55px 22px 80px}.eyebrow{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:800}.title{font:700 clamp(35px,5vw,54px)/1.1 'Playfair Display',serif;margin:12px 0}.muted{color:var(--muted);font-size:13px;line-height:1.8}.orders{display:grid;gap:14px;margin-top:28px}.order{background:linear-gradient(145deg,#103025,#0a2119);border:1px solid var(--line);border-radius:17px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.ref{font-weight:800;font-size:13px}.status{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.meta{color:var(--muted);font-size:11px;margin-top:7px}.items{display:grid;gap:8px;margin-top:18px}.item{display:flex;justify-content:space-between;gap:15px;color:#d7ded8;font-size:12px}.total{display:flex;justify-content:space-between;border-top:1px solid #ffffff12;padding-top:14px;margin-top:15px;font-size:13px}.total strong{color:var(--gold)}.empty,.notice{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:25px;margin-top:25px;color:var(--muted);font-size:13px;line-height:1.8}.btn{display:inline-block;margin-top:15px;padding:12px 16px;border-radius:10px;background:var(--gold);color:#142018;font-weight:900;font-size:12px;text-decoration:none}.danger{color:#ffb3a8}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.toolbar button{border:1px solid var(--line);background:#0b241a;color:var(--cream);padding:11px 14px;border-radius:10px;cursor:pointer}.toolbar button:hover{border-color:var(--gold)}@media(max-width:500px){.wrap{padding-top:35px}.order{padding:16px}}
</style></head><body><header class="top"><a class="logo" href="storefront.html">TeleShop <span>Ethiopia.</span></a><a href="storefront.html">← Continue shopping</a></header><main class="wrap"><span class="eyebrow">CUSTOMER ACCOUNT</span><h1 class="title">Your orders.</h1><p class="muted">Track orders you placed while signed in. For guest checkout, keep the order reference and contact the seller for updates.</p><div class="toolbar"><button id="refreshOrders">Refresh orders</button><button id="logoutButton">Sign out</button></div><div id="notice" class="notice">Loading your orders…</div><div id="orders" class="orders"></div></main><script src="config.js"></script><script src="customer-orders.js"></script></body></html>
