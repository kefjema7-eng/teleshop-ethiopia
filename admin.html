<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c16"><title>Admin Console | TeleShop Ethiopia"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#071c16;--panel:#0c281f;--gold:#e2b956;--cream:#f2efe7;--muted:#9aa79f;--line:rgba(226,185,86,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#173b2b 0,transparent 34%),var(--bg);color:var(--cream);font-family:Manrope,Arial,sans-serif}.top{padding:20px 5vw;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:21px;text-decoration:none;color:var(--cream)}.logo span{color:var(--gold)}.top button,.tab{border:1px solid var(--line);background:#0b241a;color:var(--cream);padding:11px 14px;border-radius:10px;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:45px 22px 80px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800}.title{font:700 clamp(34px,5vw,50px)/1.1 'Playfair Display',serif;margin:10px 0}.muted{color:var(--muted);font-size:12px;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:25px 0}.metric,.panel{background:linear-gradient(145deg,#103025,#0a2119);border:1px solid var(--line);border-radius:17px;padding:20px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:26px;margin-top:10px;color:var(--gold)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tab.active{background:var(--gold);color:#142018;border-color:var(--gold);font-weight:800}.panel h2{font-size:16px;margin:0 0 15px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff12}th{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:1px}td{color:#dbe2dc}select{background:#071b14;color:var(--cream);border:1px solid var(--line);border-radius:7px;padding:7px}.message{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.7}.hidden{display:none}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.metrics{grid-template-columns:1fr 1fr}.metric{padding:14px}.metric strong{font-size:21px}}
</style></head><body><header class="top"><a class="logo" href="storefront.html">TeleShop <span>Admin.</span></a><div><a href="storefront.html" style="color:var(--gold);font-size:12px;text-decoration:none;margin-right:15px">Marketplace</a><button id="logout">Sign out</button></div></header><main class="wrap"><span class="eyebrow">MARKETPLACE CONTROL CENTER</span><h1 class="title">Operations overview.</h1><p class="muted">Administrator access only. Use this console to review marketplace activity, orders, and account status.</p><div id="notice" class="message">Verifying administrator access…</div><section id="app" class="hidden"><div class="metrics" id="metrics"></div><nav class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="users">Users</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button></nav><section id="overviewTab" class="panel"><h2>Recent marketplace orders</h2><div id="recentOrders" class="table-wrap"></div></section><section id="usersTab" class="panel hidden"><h2>Accounts</h2><div id="usersTable" class="table-wrap"></div></section><section id="productsTab" class="panel hidden"><h2>Product moderation</h2><p class="muted">Hide products that should not appear in the public marketplace. This does not delete seller records.</p><div id="productsTable" class="table-wrap"></div></section><section id="ordersTab" class="panel hidden"><h2>All orders</h2><div id="ordersTable" class="table-wrap"></div></section></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
